plugins { id 'com.android.application' }

android {
    namespace 'net.urbanrunnerx.mandelbrot'
    compileSdk 36
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'net.urbanrunnerx.mandelbrot'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }
    sourceSets.main.assets.srcDirs = [layout.buildDirectory.dir('generated/webAssets')]
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_FILE')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_FILE'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

tasks.register('syncWebAssets', Sync) {
    from('../../web') { exclude 'tests/**' }
    into(layout.buildDirectory.dir('generated/webAssets'))
}
tasks.named('preBuild').configure { dependsOn 'syncWebAssets' }
