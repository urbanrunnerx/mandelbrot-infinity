name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      signed_release:
        description: Build a release using the configured private signing secrets
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test fractal mathematics
        run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The action's old default includes the retired Android "tools" package.
          packages: platform-tools
          cmdline-tools-version: '12266719'
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare wrapper
        run: chmod +x android/gradlew
      - name: Build development APK
        if: ${{ !inputs.signed_release }}
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Prepare private signing key
        if: ${{ inputs.signed_release }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configure the existing release signing key in repository secrets.'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mandelbrot-release.p12"
          chmod 600 "$RUNNER_TEMP/mandelbrot-release.p12"
      - name: Build signed release APK
        if: ${{ inputs.signed_release }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/mandelbrot-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mandelbrot-Infinity-${{ inputs.signed_release && 'release' || 'debug' }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Remove temporary signing key
        if: ${{ always() && inputs.signed_release }}
        run: rm -f "$RUNNER_TEMP/mandelbrot-release.p12"
